name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: Build fusion
        run: go build -o /tmp/fusion ./cmd/fusion

      - name: ks tests (per-file timeout)
        run: /tmp/fusion test ./tests --timeout 30

      - name: Format check
        run: /tmp/fusion fmt . --check
